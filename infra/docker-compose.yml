# Local dev stack for Scout (M1-T05a).
#
# Usage:
#   make docker-up        # boots db + backend + web
#   make docker-down      # tears down, preserving the pgdata volume
#   make docker-up + --profile ingest:
#     docker compose --project-directory . -f infra/docker-compose.yml \
#                    --profile ingest run --rm ingest
#
# Paths: all relative paths below are resolved against Compose's project
# directory, which the Makefile pins to the **repo root** via
# `--project-directory $(ROOT)` so the same `.env` powers backend and
# Compose. If you invoke `docker compose` directly, pass the same flag,
# or run from the repo root so the default resolves there.
#
# Bind mounts give hot-reload semantics; named volumes shield
# .venv / node_modules from the host so platform-specific binaries do not
# clobber each other.
#
# Network: a single user-defined bridge so services resolve by name
# (`db`, `backend`).

name: scout

services:

  db:
    build:
      context: .
      dockerfile: infra/Dockerfile.postgres
    image: scout-postgis:local
    container_name: scout-db
    environment:
      POSTGRES_DB: scout
      POSTGRES_USER: scout
      POSTGRES_PASSWORD: scout
    ports:
      # Host port is overridable for users with another Postgres on :5432
      # (`SCOUT_DB_HOST_PORT=5433 make docker-up`). Container-internal port
      # stays 5432 so the bridge network DSN (`db:5432`) is unaffected.
      - "${SCOUT_DB_HOST_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scout -d scout -h 127.0.0.1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: infra/Dockerfile
      target: dev-backend
    image: scout-backend:dev
    container_name: scout-backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Compose-network DSN — inside the bridge, `db` resolves to the
      # PostGIS container. The host-side override lives in `.env.example`.
      SCOUT_DATABASE_URL: postgresql+asyncpg://scout:scout@db:5432/scout
      # Provider stubs let the stack boot without external secrets.
      SCOUT_ROUTING_PROVIDER: stub
      SCOUT_GEOCODING_PROVIDER: stub
      SCOUT_RESTROOMS_PROVIDER: stub
      SCOUT_LOG_LEVEL: INFO
      # Dev-only CORS opt-in (PRD M1-F12; AGENTS.md "Security and privacy posture").
      # Production runs the `runtime` image with this unset → CORS stays closed.
      # Honors SCOUT_WEB_HOST_PORT so non-default host ports (e.g. 3001) work.
      SCOUT_CORS_ALLOWLIST_CSV: "http://localhost:${SCOUT_WEB_HOST_PORT:-3000}"
      PYTHONPATH: /app/apps/backend
    volumes:
      # Bind mount mirrors the uv-workspace layout: workspace root at /app,
      # member at /app/apps/backend. The venv at /app/.venv lives outside
      # this path so no shielding volume is needed.
      - ./apps/backend:/app/apps/backend
      # Read-only data drop for ingestion fixtures (M1-F02 will populate).
      - ./data:/app/data:ro
    ports:
      # Host port overridable for users with another API on :8080.
      - "${SCOUT_BACKEND_HOST_PORT:-8080}:8080"
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: infra/Dockerfile
      target: dev-web
    image: scout-web:dev
    container_name: scout-web
    depends_on:
      - backend
    environment:
      # Point the browser at the host-published backend so dev-tools links
      # resolve from the user's machine, not from inside the container.
      # If SCOUT_BACKEND_HOST_PORT is overridden, the browser must hit the
      # new host port (not the container port 8080), hence the interpolation.
      NEXT_PUBLIC_SCOUT_API_BASE_URL: "http://localhost:${SCOUT_BACKEND_HOST_PORT:-8080}"
      NEXT_PUBLIC_SCOUT_MAP_MODE: stub
      # Per DEC-022 the frontend's only geocoder transports are `backend`
      # (calls our own /api/geocode/*) and `stub`. The stubbed stack here
      # keeps the in-process stub for offline dev.
      NEXT_PUBLIC_SCOUT_GEOCODING_PROVIDER: "stub"
      NEXT_TELEMETRY_DISABLED: "1"
    volumes:
      - ./apps/web:/app/web
      # Shielded from host bind mount; persists until removed explicitly
      # (infra/README.md "Resetting web node_modules").
      - web-node_modules:/app/web/node_modules
      - web-next:/app/web/.next
    ports:
      # Host port overridable for users with another dev server on :3000.
      - "${SCOUT_WEB_HOST_PORT:-3000}:3000"
    restart: unless-stopped

  # Profile-gated. Stays out of `docker compose up` until invoked
  # explicitly so it cannot block the dev loop. Runs inside the bridge
  # network so `db:5432` resolves and the host-side DSN / host-port
  # remapping never enters the picture.
  #
  #   make ingest-dc-addresses
  #   # raw equivalent:
  #   docker compose --project-directory . -f infra/docker-compose.yml \
  #                  --profile ingest run --rm ingest
  #
  # Extra args pass through:
  #   docker compose ... --profile ingest run --rm ingest --dry-run
  #
  # When scripts/ingest_dc.py (M1-F11 / M1-T03) lands, give it its own
  # service or argument switch — keep this one focused on DC MAR per
  # DEC-023 so the failure surface stays small.
  ingest:
    profiles: ["ingest"]
    build:
      context: .
      dockerfile: infra/Dockerfile
      target: dev-backend
    image: scout-backend:dev
    container_name: scout-ingest
    depends_on:
      db:
        condition: service_healthy
    environment:
      SCOUT_DATABASE_URL: postgresql+asyncpg://scout:scout@db:5432/scout
      PYTHONPATH: /app/apps/backend
    volumes:
      - ./apps/backend:/app/apps/backend
      # Writable so the Overpass cache (data/derived/) can be populated on
      # first run; everything else under /app/data stays untouched.
      - ./data:/app/data
      - ./scripts:/app/scripts:ro
    working_dir: /app
    # The dev-backend image bakes /app/.venv (with python + deps) onto $PATH
    # via the deps-backend stage; we invoke its python directly. PYTHONPATH
    # above is what lets `from scout.config import ...` resolve.
    entrypoint: ["python", "/app/scripts/ingest_dc_addresses.py"]
    restart: "no"

volumes:
  pgdata:
  web-node_modules:
  web-next:
