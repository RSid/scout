name: Build DC PMTiles
description: Restore or build apps/web/public/tiles/dc.pmtiles for interactive E2E

inputs:
  protomaps-build-date:
    description: Pinned Protomaps daily build slug (SCOUT_PROTOMAPS_BUILD_DATE)
    required: false
    default: "20260528"

runs:
  using: composite
  steps:
    - name: Restore dc.pmtiles cache
      id: pmtiles-cache
      uses: actions/cache@v4
      with:
        path: apps/web/public/tiles/dc.pmtiles
        key: pmtiles-${{ runner.os }}-${{ inputs.protomaps-build-date }}-${{ hashFiles('scripts/build_pmtiles.sh') }}

    - name: Install pmtiles CLI and extract DC tiles
      if: steps.pmtiles-cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        set -euo pipefail
        PMTILES_CLI_VERSION=1.30.2
        curl -fsSL \
          "https://github.com/protomaps/go-pmtiles/releases/download/v${PMTILES_CLI_VERSION}/go-pmtiles_${PMTILES_CLI_VERSION}_Linux_x86_64.tar.gz" \
          -o /tmp/go-pmtiles.tgz
        echo "2cd3aa18868297fc88425038f794efdc0995e0275f4ca16fa496dd79e245a40c  /tmp/go-pmtiles.tgz" | sha256sum -c -
        sudo tar -xzf /tmp/go-pmtiles.tgz -C /usr/local/bin pmtiles
        sudo chmod +x /usr/local/bin/pmtiles
        rm -f /tmp/go-pmtiles.tgz
        SCOUT_PROTOMAPS_BUILD_DATE="${{ inputs.protomaps-build-date }}" \
          ./scripts/build_pmtiles.sh
